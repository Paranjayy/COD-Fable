<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>COD FABLE — Tactical Sandbox</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      #app, #game { display: block; width: 100vw; height: 100vh; }
      #game { touch-action: none; cursor: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
        pointer-events: none; color: rgba(235, 242, 247, .92); background: #070a0d;
        font: 600 12px/1.4 "Helvetica Neue", Arial, sans-serif; letter-spacing: .22em;
        text-transform: uppercase; transition: opacity .35s ease;
      }
      #boot.ready { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
